name: Corrective Targeted Verification

on:
  push:
    branches:
      - 'corrective/**'
    paths:
      - 'server.ts'
      - 'src/__tests__/integration.test.ts'
      - 'src/modules/document-formatting/**'
      - 'docs/CORRECTIVE_2026-11-01_SECURITY_DOCFMT.md'
      - '.github/workflows/corrective-targeted-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ci-test-only-not-a-production-key

jobs:
  affected-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Targeted UI and API tests
        run: npx vitest run src/modules/document-formatting/__tests__/DocumentFormattingModule.test.tsx src/__tests__/integration.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Document worker and production build
        run: npm run build


  lockfile-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Propose only semver-compatible advisory patches
        run: |
          npm update --package-lock-only --no-save body-parser re2js seroval vite zod
          git diff --check
          git diff --stat -- package-lock.json
          if ! git diff --quiet -- package.json; then
            echo 'Unexpected package.json mutation' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const oldLock = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const newLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changes = [...new Set([...Object.keys(oldLock.packages), ...Object.keys(newLock.packages)])]
            .filter(path => JSON.stringify(oldLock.packages[path]) !== JSON.stringify(newLock.packages[path]))
            .map(path => ({ path, before: oldLock.packages[path]?.version ?? null, after: newLock.packages[path]?.version ?? null }));
          console.log('LOCKFILE_CANDIDATE_PACKAGE_CHANGES=' + JSON.stringify(changes));
          NODE
      - name: Produce unapproved advisory inventory for review
        run: |
          npm audit --json > advisory-inventory.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('advisory-inventory.json', 'utf8'));
          console.log('CANDIDATE_VULNERABILITIES=' + JSON.stringify(data.metadata?.vulnerabilities || {}));
          console.log('CANDIDATE_HIGH_PACKAGES=' + JSON.stringify(Object.entries(data.vulnerabilities || {}).filter(([,v]) => ['high','critical'].includes(v.severity)).map(([name,v]) => ({ name, severity:v.severity }))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-npm-lock-candidate
          if-no-files-found: error
          retention-days: 3
          path: |
            package-lock.json
            advisory-inventory.json

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security policy + dependency audit (never allowlisted on expiry)
        run: |
          npx vitest run scripts/security-audit-policy.test.mjs
          node scripts/security-audit.mjs
