name: M1 ND30 canonical-only targeted verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verification branch (includes test harness)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact checkout SHA and ensure canonical baseline ancestor
        run: |
          git rev-parse HEAD
          git merge-base --is-ancestor 7adc5f3dbbe5ccd834cd912a7ecda3f1eae27ef1 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install canonical dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical and check worker ESM/CJS
        run: |
          npm run build
          node --check server/modules/document-formatting/docxWorker.mjs
          test -s dist/docx.worker.cjs
          node --check dist/docx.worker.cjs
      - name: Targeted document and capability tests
        shell: bash
        run: |
          mapfile -t tests < <(git ls-files '*test.ts' '*test.tsx' '*spec.ts' '*spec.tsx' | grep -Ei '(document|docx|capabilit|module|filePolicy|permission)' || true)
          printf 'Targeted test files: %s\n' "${tests[*]}"
          if [ "${#tests[@]}" -eq 0 ]; then echo "::error::No targeted tests"; exit 43; fi
          ./node_modules/.bin/vitest run "${tests[@]}"
      - name: Worker rejects invalid DOCX for all four operations
        run: |
          node --input-type=module <<'NODE'
          import { Worker } from 'node:worker_threads';
          async function invoke(operation) {
            const worker = new Worker(new URL('./server/modules/document-formatting/docxWorker.mjs', import.meta.url));
            return await new Promise((resolve,reject) => {
              const timer = setTimeout(() => { void worker.terminate(); reject(new Error('timeout')); },5000);
              worker.once('message', result => { clearTimeout(timer); void worker.terminate(); resolve(result); });
              worker.once('error', error => { clearTimeout(timer); reject(error); });
              worker.postMessage({operation,bytes:Buffer.from('fake-docx'),input:{}});
            });
          }
          for (const op of ['inspect','applyAlignment','applyTopMargin','applyAdministrativePageLayout']) {
            const r=await invoke(op);
            if (r.ok!==false || typeof r.code!=='string') throw new Error('fail-closed violated: '+op);
            console.log(op,r.code);
          }
          NODE
      - name: Document rule authority reference
        run: |
          echo 'ND30 verified rules are sourced from quanggiaphthh/chuan-hoa-van-ban-nghi-dinh-30 at SHA 078dae21f9e23975676179fa189f5c01b605f49a'
          echo 'This workflow does NOT checkout Docs-ND30.'
      - name: Evidence summary
        if: always()
        run: |
          echo "Agent branch SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Rule authority SHA: 078dae21f9e23975676179fa189f5c01b605f49a" >> "$GITHUB_STEP_SUMMARY"
          echo "Remaining API/Auth/XSS and administrative-data acceptance require separate targeted evidence; no automatic M1 PASS." >> "$GITHUB_STEP_SUMMARY"
