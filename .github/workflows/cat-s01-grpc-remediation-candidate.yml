# One-time, branch-scoped CAT-S01 compatibility experiment.
# This is NOT an approval to ship an out-of-range Firebase dependency override.
name: CAT S01 gRPC compatibility candidate
on:
  push:
    branches: ['cat/integration-core-agent-task-20261105']
    paths: ['.github/workflows/cat-s01-grpc-remediation-candidate.yml']
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'quanggiaphthh/Agent-Workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ci-test-only-not-a-production-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate isolated scoped override and native npm lock
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            '@firebase/firestore': {
              ...(pkg.overrides?.['@firebase/firestore'] || {}),
              '@grpc/grpc-js': '1.13.6'
            }
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install, exact graph and patched packages
        shell: bash
        run: |
          npm ci --ignore-scripts --no-fund
          npm ls firebase @firebase/firestore @grpc/grpc-js --all
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const grpc = Object.entries(lock.packages || {})
            .filter(([p]) => p.endsWith('node_modules/@grpc/grpc-js'))
            .map(([path, info]) => ({ path, version: info.version }));
          console.log('CAT-S01 resolved gRPC graph:', JSON.stringify(grpc));
          if (!grpc.length || grpc.some(({version}) => !['1.13.6', '1.14.5'].includes(version))) {
            throw new Error('CAT-S01: at least one grpc-js copy is unpatched or missing');
          }
          if (lock.packages?.['node_modules/@firebase/firestore/node_modules/@grpc/grpc-js']?.version !== '1.13.6') {
            throw new Error('CAT-S01: Firestore nested grpc-js must be patched 1.13.6');
          }
          if (lock.packages?.['node_modules/@firebase/firestore']?.dependencies?.['@grpc/grpc-js'] !== '~1.9.0') {
            throw new Error('CAT-S01: unexpected change in the upstream Firestore dependency contract');
          }
          NODE
      - name: Canonical dependency security gate - no waiver changes
        run: node scripts/security-audit.mjs
      - name: Targeted Firebase / Auth / Agent / Tasks regressions
        run: |
          npm run lint
          npx vitest run src/lib/FirebaseAuthProvider.test.tsx src/core/modules/moduleRegistry.reliability.test.ts src/agent/ui/AdkRuntimeProvider.identity.test.tsx src/modules/tasks/TasksModule.identity.test.tsx server/core/data/__tests__/taskContract.test.ts server/agent/adk/__tests__/capabilityToolBridge.test.ts
      - name: Production build and source manifest
        run: |
          npm run build
          node scripts/verify-production-source-manifest.mjs
      - name: Commit candidate graph to integration PR branch - never main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'test(security): trial patched gRPC scoped Firestore dependency graph'
            git push origin HEAD:cat/integration-core-agent-task-20261105
          fi
