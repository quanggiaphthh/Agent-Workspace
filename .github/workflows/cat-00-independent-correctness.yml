name: CAT-00 Independent Correctness

on:
  push:
    branches: ['cat/00-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ci-test-only-not-a-production-key

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Production diagnostic security regression
        run: npx vitest run src/__tests__/integration.test.ts
      - name: Full Vitest
        run: npm run test
      - name: Canonical QA Stage 1
        run: node scripts/qa-stage1.mjs
      - name: Canonical QA Stage 2
        run: node scripts/qa-stage2.mjs
      - name: Canonical QA Stage 3A
        run: node scripts/qa-stage3a.mjs
      - name: Canonical QA Stage 3B
        run: node scripts/qa-stage3b.mjs
      - name: Canonical QA Stage 3C
        run: node scripts/qa-stage3c.mjs
      - name: Canonical QA Stage 4A
        run: node scripts/qa-stage4a.mjs
      - name: Canonical QA Stage 4B
        run: node scripts/qa-stage4b.mjs
      - name: Canonical QA Stage 4C
        run: node scripts/qa-stage4c.mjs
      - name: Canonical QA Stage 4D
        run: node scripts/qa-stage4d.mjs
      - name: Canonical QA Stage 5
        run: node scripts/qa-stage5-static.mjs
      - name: W11 security QA
        run: node scripts/qa-w11-security.mjs
      - name: Production build
        run: npm run build
      - name: Manifest verification
        run: node scripts/verify-production-source-manifest.mjs
