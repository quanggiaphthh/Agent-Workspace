name: CAT Core-Agent-Task verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ci-test-only-not-a-production-key

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: CAT-01 Core reliability + locked architecture regressions
        run: npx vitest run src/core/modules/moduleRegistry.reliability.test.ts src/core/context/contextStore.identity.test.ts src/__tests__/architecture.test.ts
      - name: CAT Auth and Task owner-boundary regressions
        run: npx vitest run src/lib/FirebaseAuthProvider.test.tsx src/modules/tasks/TasksModule.identity.test.tsx server/core/data/__tests__/taskContract.test.ts

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical security audit (release-blocking)
        run: node scripts/security-audit.mjs
      - name: W11 bounded security QA
        run: node scripts/qa-w11-security.mjs
